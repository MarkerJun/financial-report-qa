<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>家电财报 · 证据问答</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f7;color:#17343d;font:16px 'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:44px 32px}header{border-bottom:1px solid #cbdadd;padding-bottom:25px}.tag{color:#147b77;letter-spacing:2px;font-size:13px}h1{font-size:36px;margin:13px 0}p{line-height:1.8;color:#587078}.stats{display:flex;gap:20px;margin:25px 0}.stats div{background:white;padding:18px 25px;border-radius:10px;flex:1}.stats b{font-size:26px;color:#147b77}section{background:white;border:1px solid #dce6e8;border-radius:12px;padding:25px;margin:20px 0}textarea{width:100%;height:90px;font:17px 'Microsoft YaHei';padding:16px;border:1px solid #c6d7da;border-radius:8px}button,select{padding:11px 20px;border-radius:7px;border:1px solid #bdced0;background:white;cursor:pointer;margin-top:12px}button.primary{background:#147b77;color:white;border:0;float:right}.examples button{font-size:13px;margin-right:8px;color:#49636c}.answer{white-space:pre-wrap;line-height:1.9}details{border-top:1px solid #dce6e8;padding:16px 0}summary{cursor:pointer;font-weight:bold}pre{white-space:pre-wrap;line-height:1.7;font:14px 'Microsoft YaHei';background:#f6f8f9;padding:16px;max-height:440px;overflow:auto}a{color:#147b77}.notice{font-size:13px;color:#926020}#busy{color:#147b77}</style>
<main><header><div class="tag">ANNUAL REPORT INTELLIGENCE / 作业三 · 方向 A</div><h1>家电财报，回答有据可查。</h1><p>2025 年度 · 十家 A 股公司 · BM25 + LSA 向量混合检索 · 原文与页码溯源</p></header><div class="stats"><div><b>10</b> 家上市公司</div><div><b id="chunks">—</b> 个证据块</div><div><b>2025</b> 统一报告年度</div></div><section><h2>向财报提问</h2><textarea id="q">美的集团2025年营业收入是多少？</textarea><select id="mode"><option value="hybrid">混合检索 · RRF</option><option value="bm25">仅 BM25</option><option value="vector">仅 LSA 向量</option></select><button class="primary" id="ask">检索并回答 →</button><div class="examples"><button>格力电器2025年研发投入是多少？</button><button>十家公司的营业收入分别是多少？</button><button>海尔智家与海信家电面临哪些经营风险？</button></div><p class="notice" id="notice"></p><span id="busy"></span></section><section id="result" hidden><div class="tag">ANSWER / 回答与证据</div><h2>检索结果</h2><div class="answer" id="answer"></div><h3 id="count"></h3><div id="evidence"></div></section><p>规则回答覆盖部分年度数值题；解释题展示原文证据。比较数据前请核对合并口径、指标名称和单位。PDF 页码从文件第一页起计。</p></main>
<script>const $=id=>document.getElementById(id);fetch('/api/status').then(r=>r.json()).then(d=>{$('chunks').textContent=d.chunks.toLocaleString();$('notice').textContent=d.model_configured?'已配置生成模型，答案依据检索证据生成。':'无需密钥模式：标准指标按规则抽取并引用原文；复杂解释题展示证据。'});document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{$('q').value=b.textContent;$('ask').click()});$('ask').onclick=async()=>{$('ask').disabled=true;$('busy').textContent='正在检索财报…';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value,mode:$('mode').value})});const d=await r.json();if(!r.ok)throw Error(d.error);$('result').hidden=false;$('answer').textContent=d.answer;$('count').textContent=`原文证据 · ${d.evidence.length} 块`;$('evidence').replaceChildren();d.evidence.forEach((e,i)=>{const details=document.createElement('details');details.open=i===0;const sum=document.createElement('summary');sum.textContent=`[E${i+1}] ${e.company} · PDF 第 ${e.page} 页 · ${e.kind==='table'?'表格':'正文'} · ${e.section}`;const pre=document.createElement('pre');pre.textContent=e.text;const a=document.createElement('a');a.href=`/pdf/${e.code}#page=${e.page}`;a.target='_blank';a.textContent='打开原始 PDF 核验 ↗';details.append(sum,pre,a);$('evidence').append(details)})}catch(e){$('busy').textContent='错误：'+e.message;return}finally{$('ask').disabled=false}$('busy').textContent='检索完成'};</script></html>
